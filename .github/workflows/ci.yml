name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name:  Install dependencies
        shell: bash
        run:   |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install \
              build-essential \
              flex \
              bison \
              cmake \
              ccache \
              curl \
              ninja-build \
              pkg-config \
              libssl-dev \
              libcurl4-openssl-dev \
              zlib1g-dev \
              xz-utils \
              texinfo \
              device-tree-compiler \
              u-boot-tools \
              lzop \
              libusb-1.0-0-dev \
              python3 \
              python-is-python3 \
              libpython3-dev \
              python3-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install python dtc u-boot-tools texinfo
            brew install autoconf automake libtool pkg-config ccache ninja openssl
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi
      - name: Cache compiler results and RSB downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/grisp-native-cache
          key: grisp-native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: grisp-native-v1-${{ matrix.os }}-${{ runner.arch }}-
      - name: Build toolchain
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/grisp-native-cache/ccache
          CCACHE_MAXSIZE: 2G
          RSB_SOURCE_CACHE: ${{ runner.temp }}/grisp-native-cache/sources
        run: |
          ccache --zero-stats
          make install USE_CCACHE=1
          ccache --show-stats --verbose
          if [ "$RUNNER_OS" == "Linux" ]; then
            make barebox
          fi
      - name: Get errorinfo
        shell: bash
        if: ${{ failure() }}
        run: |
          find . -name "rsb-report-*" \
            -exec echo "________________________________________________________________________________________________________" \; \
            -exec echo '{}' \; \
            -exec echo "________________________________________________________________________________________________________" \; \
            -exec tail -500 '{}' \; \
            -exec echo \;
      - name: Build demo application
        shell: bash
        run: |
          make demo
      - name: Build OpenOCD
        shell: bash
        run: |
          make openocd
      - name: Build imx_uart
        shell: bash
        run: |
          make imx_uart
      - name: Set up Python for Rust SDK checks
        id: sdk-check-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          update-environment: false
      - name: Build and validate Rust before packaging
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/grisp-native-cache/ccache
          CCACHE_MAXSIZE: 2G
          RSB_SOURCE_CACHE: ${{ runner.temp }}/grisp-native-cache/sources
          SDK_CHECK_PYTHON: ${{ steps.sdk-check-python.outputs.python-path }}
        run: |
          "$SDK_CHECK_PYTHON" external/rtems-rust/tests/check-inputs.py
          ccache --zero-stats
          make rust-support USE_CCACHE=1
          ccache --show-stats --verbose
          # The checker copies the whole SDK. Release the bootstrap scratch space first.
          rm -rf -- build/rust
          check_dir=$(mktemp -d "$RUNNER_TEMP/grisp-rust-check.XXXXXX")
          trap 'chmod -R u+w "$check_dir" && rm -rf -- "$check_dir"' EXIT
          "$SDK_CHECK_PYTHON" external/rtems-rust/tests/check-installed.py \
            --prefix "$PWD/rtems/5" --c-prefix "$PWD/rtems/5" \
            --output "$check_dir" --skip-host-nifs
      - name: Create package
        run: make package
      - name: Upload package artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: package-${{ runner.os }}
          compression-level: 0
          path: |
            package/*
            external/rtems-source-builder/rtems/rsb-report-*.txt

  upload:
    permissions:
      actions: read
    if: ${{ github.ref == 'refs/heads/master' }} # Only upload on master builds
    needs: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:

      - name: Download a single artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: package-${{ runner.os }}
          path: artifact

      - name: Upload to S3
        run: aws s3 cp --recursive --acl public-read artifact/package/ s3://grisp/platforms/grisp2/toolchain/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GRISP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GRISP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
