name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
  repository_dispatch:
    types: [build-docker-image]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      IMAGE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          scope: grisp/grisp2-rtems-toolchain@push

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          provenance: false
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          tags: grisp/grisp2-rtems-toolchain:${{ env.IMAGE_TAG }}-${{ matrix.platform_suffix }}

  publish:
    name: Publish multi-architecture manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build
    env:
      IMAGE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag grisp/grisp2-rtems-toolchain:${IMAGE_TAG} \
            --tag grisp/grisp2-rtems-toolchain:latest \
            grisp/grisp2-rtems-toolchain:${IMAGE_TAG}-amd64 \
            grisp/grisp2-rtems-toolchain:${IMAGE_TAG}-arm64
