name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
  repository_dispatch:
    types: [build-docker-image]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push multi-architecture image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      IMAGE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.IMAGE_TAG }}
          submodules: recursive
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: grisp
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          scope: grisp/grisp2-rtems-toolchain@push

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: grisp/grisp2-rtems-toolchain:${{ env.IMAGE_TAG }}
