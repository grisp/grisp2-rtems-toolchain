name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: Push validated images and update the release and latest tags
        default: true
        type: boolean
      tag:
        description: Docker image tag
        required: true
        type: string
  repository_dispatch:
    types: [build-docker-image]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      IMAGE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
      PLATFORM_SUFFIX: ${{ matrix.platform_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out the requested tag
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Free space for the compiler build
        run: |
          # All compilation runs in Docker; these preinstalled host SDKs are unused.
          df -h /
          sudo rm -rf /opt/hostedtoolcache/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Prepare Rust SDK validation
        run: |
          if [ "$(git ls-files --stage -- external/rtems-rust | cut -d ' ' -f 1)" = 160000 ]; then
            git submodule update --init -- external/rtems-rust
          fi
          if [ ! -f external/rtems-rust/tests/check-installed.py ]; then
            echo "::error::The requested tag must include Rust SDK support."
            exit 1
          fi

      - name: Validate Rust source pins
        run: python3 external/rtems-rust/tests/check-inputs.py

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cache compiler results and RSB downloads
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/grisp-docker-cache
          key: grisp-docker-v1-${{ matrix.platform_suffix }}-${{ steps.checkout.outputs.commit }}
          restore-keys: grisp-docker-v1-${{ matrix.platform_suffix }}-

      - name: Restore BuildKit cache mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/grisp-cache-dance
          utility-image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          cache-map: |
            {"${{ runner.temp }}/grisp-docker-cache": {"target": "/var/cache/grisp-build", "sharing": "locked"}}
          skip-extraction: ${{ steps.build-cache.outputs.cache-hit }}

      - name: Build Rust-enabled image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          provenance: false
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          pull: true
          build-args: |
            RUST_SUPPORT=1
            USE_CCACHE=1
          tags: grisp/grisp2-rtems-toolchain:${{ env.IMAGE_TAG }}-${{ matrix.platform_suffix }}

      - name: Validate installed Rust SDK
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD/external/rtems-rust/tests/check-installed.py,target=/tmp/check-rust-sdk.py,readonly" \
            "grisp/grisp2-rtems-toolchain:${IMAGE_TAG}-${PLATFORM_SUFFIX}" \
            sh -ec 'exec python3 /tmp/check-rust-sdk.py \
              --prefix "$GRISP_TOOLCHAIN" --c-prefix "$GRISP_TOOLCHAIN" \
              --output /tmp/rust-sdk-check --skip-host-nifs'

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push validated image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: docker push "grisp/grisp2-rtems-toolchain:${IMAGE_TAG}-${PLATFORM_SUFFIX}"

  publish:
    name: Publish multi-architecture manifest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build
    env:
      IMAGE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag "grisp/grisp2-rtems-toolchain:${IMAGE_TAG}" \
            --tag grisp/grisp2-rtems-toolchain:latest \
            "grisp/grisp2-rtems-toolchain:${IMAGE_TAG}-amd64" \
            "grisp/grisp2-rtems-toolchain:${IMAGE_TAG}-arm64"
